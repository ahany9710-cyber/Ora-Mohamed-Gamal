<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
body { margin: 0; background: #0f0e0c; -webkit-tap-highlight-color: transparent; overflow-x: clip; }
a { color: #e6cf9f; } a:hover { color: #f5efe4; }
button:focus-visible, a:focus-visible { outline: 2px solid #c9a96e; outline-offset: 3px; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes checkIn { 0% { transform: scale(0) rotate(-45deg); } 70% { transform: scale(1.2) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,40px) scale(1.15); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,-30px) scale(.9); } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes glowPulse { 0%,100% { box-shadow: 0 0 0 1px #c9a96e, 0 0 24px rgba(201,169,110,.25); } 50% { box-shadow: 0 0 0 1px #c9a96e, 0 0 40px rgba(201,169,110,.45); } }
@keyframes draw { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
@keyframes ringOut { from { transform: scale(.6); opacity: .8; } to { transform: scale(2.2); opacity: 0; } }
@keyframes spark { 0% { transform: rotate(var(--a)) translateY(0) scale(0); opacity: 0; } 20% { opacity: 1; transform: rotate(var(--a)) translateY(-30px) scale(1); } 100% { transform: rotate(var(--a)) translateY(-90px) scale(.3); opacity: 0; } }
@keyframes ctaGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(201,169,110,.5); } 50% { box-shadow: 0 0 0 10px rgba(201,169,110,0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</helmet>
<div dir="rtl" lang="ar" style="position: relative; min-height: 100vh; overflow: hidden; background: #0f0e0c; color: #f5efe4; font-family: 'Alexandria', system-ui, sans-serif;">
  <div aria-hidden="true" style="position: fixed; inset: 0; pointer-events: none; overflow: hidden;">
    <span style="position: absolute; top: -18%; left: -12%; width: 60vmax; height: 60vmax; border-radius: 50%; background: radial-gradient(circle, rgba(201,169,110,.16), transparent 62%); animation: drift1 22s ease-in-out infinite;"></span>
    <span style="position: absolute; bottom: -25%; right: -15%; width: 55vmax; height: 55vmax; border-radius: 50%; background: radial-gradient(circle, rgba(201,169,110,.10), transparent 62%); animation: drift2 26s ease-in-out infinite;"></span>
  </div>

  <div style="position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px) 56px; display: flex; flex-direction: column; gap: 32px; box-sizing: border-box;">

    <header style="display: flex; align-items: center; gap: 10px;">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
        </sc-if>
        <sc-if value="{{ soundOff }}" hint-placeholder-val="{{ false }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="m22 9-6 6"></path><path d="m16 9 6 6"></path></svg>
        </sc-if>
      </button>
      <a href="tel:+201200506690" style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #f5efe4; text-decoration: none; padding: 0 16px; height: 42px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(245,239,228,.18); transition: background .2s;" style-hover="background: rgba(245,239,228,.06); color: #f5efe4;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>

      </a>
    </header>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 500; color: #a69d8e;">

                <span style="position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #1d1b17;">
                  <image-slot id="ora3-{{ w.key }}" shape="rect" placeholder="صورة {{ w.name }}"></image-slot>
                </span>

                  <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                    <span dir="ltr" style="font-weight: 500; font-size: 17px; line-height: 1.25; text-align: right;">{{ w.name }}</span>
                    <span style="font-size: 13px; line-height: 1.4; color: #a69d8e;">{{ w.place }}</span>

                    <span style="position: relative; flex: none; width: 24px; height: 24px;">
                      <span style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #c9a96e; animation: ringOut .7s ease-out both;"></span>
                      <span style="position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; background: #c9a96e; color: #0f0e0c; animation: checkIn .45s cubic-bezier(.3,1.5,.5,1) both;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                      </span>
                    </span>
                  </sc-if>
                </span>
              </button>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ isOptStep }}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 24px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <span dir="ltr" style="align-self: flex-start; font-size: 13px; font-weight: 500; color: #c9a96e;">{{ crumb }}</span>
          <h2 style="margin: 0; font-weight: 500; font-size: clamp(30px, 6vw, 46px); line-height: 1.2;">{{ question }}</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px;">
          <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
            <div style="flex: 1 1 {{ o.basis }}; animation: rise .55s cubic-bezier(.2,.8,.2,1) {{ o.delay }}s both;">
              <button type="button" onClick="{{ o.pick }}" onMouseEnter="{{ hoverTick }}" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: 18px; background: {{ o.bg }}; box-shadow: {{ o.ring }}; opacity: {{ o.op }}; transform: {{ o.tf }}; animation: {{ o.anim }}; transition: background .3s, opacity .35s, transform .4s cubic-bezier(.2,.9,.3,1.2), box-shadow .3s;" style-hover="box-shadow: 0 0 0 1px rgba(201,169,110,.6), 0 16px 40px rgba(0,0,0,.4); transform: translateY(-3px);" style-active="transform: scale(.97);">
                <span style="font-weight: 500; font-size: 18px; line-height: 1.3;">{{ o.label }}</span>
                <span style="position: relative; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid {{ o.ringC }}; background: {{ o.dot }}; color: #0f0e0c; display: grid; place-items: center; transition: background .3s, border-color .3s;">
                  <sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}">
                    <span style="position: absolute; inset: -2px; border-radius: 50%; border: 1.5px solid #c9a96e; animation: ringOut .7s ease-out both;"></span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="animation: checkIn .45s cubic-bezier(.3,1.5,.5,1) both;"><path d="M20 6 9 17l-5-5"></path></svg>
                  </sc-if>
                </span>
              </button>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 24px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both;">
        <div style="display: flex; align-items: center; gap: 18px;">
          <span style="position: relative; flex: none; width: 64px; height: 64px;">
            <sc-for list="{{ sparks }}" as="s" hint-placeholder-count="0">
              <span style="--a: {{ s.a }}deg; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #f3e2bb; animation: spark 1.2s cubic-bezier(.2,.7,.3,1) {{ s.d }}s both;"></span>
            </sc-for>
            <span style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #c9a96e; animation: ringOut 1.1s ease-out .15s both;"></span>
            <span style="position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; background: #c9a96e; color: #0f0e0c; animation: checkIn .6s cubic-bezier(.3,1.5,.5,1) both;">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" style="stroke-dasharray: 40; animation: draw .5s ease-out .35s both;"></path></svg>
            </span>
          </span>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 13px; font-weight: 500; color: #c9a96e;">تمام كده</span>
            <h2 style="margin: 0; font-weight: 500; font-size: clamp(28px, 6vw, 46px); line-height: 1.2;">البروشور والأسعار جاهزين</h2>
          </div>
        </div>
        <div style="display: flex; gap: 10px;">
          <sc-for list="{{ summary }}" as="s" hint-placeholder-count="3">
            <button type="button" onClick="{{ s.edit }}" style="all: unset; box-sizing: border-box; cursor: pointer; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; background: #1a1814; box-shadow: 0 0 0 1px rgba(245,239,228,.08); animation: rise .55s cubic-bezier(.2,.8,.2,1) {{ s.delay }}s both; transition: box-shadow .25s;" style-hover="box-shadow: 0 0 0 1px rgba(201,169,110,.6);">
              <span style="font-size: 12px; color: #a69d8e;">{{ s.k }}</span>
              <span style="font-size: 15px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere;">{{ s.v }}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 10px; animation: rise .55s cubic-bezier(.2,.8,.2,1) .35s both;">
          <a href="{{ waHref }}" target="_blank" rel="noopener" onClick="{{ onWa }}" style="flex: 2 1 0; min-width: 0; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; border-radius: 999px; background: #c9a96e; color: #0f0e0c; text-decoration: none; font-weight: 600; font-size: 16px; animation: ctaGlow 2.2s ease-in-out 1s infinite; transition: background .2s, transform .2s;" style-hover="background: #d9bc85; color: #0f0e0c;" style-active="transform: scale(.97);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
            <span>ابعتهولي واتساب</span>
          </a>
          <a href="tel:+201200506690" style="flex: 1 1 0; min-width: 0; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(245,239,228,.25); color: #f5efe4; text-decoration: none; font-weight: 500; font-size: 16px; transition: background .2s, transform .2s;" style-hover="background: rgba(245,239,228,.06); color: #f5efe4;" style-active="transform: scale(.97);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            <span>اتصل</span>
          </a>
        </div>
        <button type="button" onClick="{{ restart }}" style="all: unset; cursor: pointer; align-self: flex-start; font-size: 14px; color: #a69d8e; padding: 6px 0; transition: color .2s;" style-hover="color: #f5efe4;">ابدأ من الأول</button>
      </section>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;201200506690&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sound&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;advanceDelay&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:650,&quot;min&quot;:0,&quot;max&quot;:1500,&quot;step&quot;:50,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { step: 0, project: null, unit: null, pay: null, picking: null, sound: true };
  worlds = [
    { key: 'solana-east', name: 'Solana East', place: 'القاهرة الجديدة' },
    { key: 'zed-east', name: 'ZED East', place: 'القاهرة الجديدة' },
    { key: 'zed-west', name: 'ZED West', place: 'الشيخ زايد' },
    { key: 'solana-west', name: 'Solana West', place: 'نيو زايد' },
    { key: 'silversands', name: 'Silversands', place: 'الساحل الشمالي' },
  ];
  units = ['شقة', 'دوبلكس', 'تاون هاوس', 'فيلا'];
  coastUnits = ['شاليه', 'تاون هاوس', 'توين هاوس', 'فيلا'];
  pays = ['كاش', 'تقسيط', 'لسه بقرر'];
  sparks = Array.from({ length: 12 }, (_, i) => ({ a: i * 30, d: +(.25 + (i % 3) * .05).toFixed(2) }));

  componentDidMount() {
    this.onKey = e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const n = parseInt(e.key, 10), s = this.state.step;
      const list = s === 0 ? this.worlds.map(w => w.key) : s === 1 ? this.unitList() : s === 2 ? this.pays : [];
      if (n >= 1 && n <= list.length) this.pick(s, list[n - 1]);
      if (e.key === 'Escape') this.back();
    };
    addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { removeEventListener('keydown', this.onKey); clearTimeout(this.t); }
  unitList() { return this.state.project === 'silversands' ? this.coastUnits : this.units; }

  tone(freq, at = 0, len = .5, vol = .07, type = 'sine') {
    if (!this.state.sound || !(this.props.sound ?? true)) return;
    try {
      const a = this.ac || (this.ac = new (window.AudioContext || window.webkitAudioContext)());
      if (a.state === 'suspended') a.resume();
      const t = a.currentTime + at, o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain();
      o.type = type; o2.type = 'sine';
      o.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq * 2, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + len);
      const g2 = a.createGain(); g2.gain.value = .25;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(a.destination);
      o.start(t); o2.start(t); o.stop(t + len + .05); o2.stop(t + len + .05);
    } catch (e) {}
  }
  pick(step, val) {
    if (this.state.picking || step !== this.state.step) return;
    const field = ['project', 'unit', 'pay'][step];
    this.tone([523.25, 659.25, 783.99][step], 0, .6, .08);
    this.tone([783.99, 987.77, 1174.66][step], .06, .5, .04);
    navigator.vibrate && navigator.vibrate(8);
    this.setState({ [field]: val, picking: val });
    this.t = setTimeout(() => {
      const next = step + 1;
      this.setState({ step: next, picking: null });
      if (next === 3) [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, i * .11, 1.4, .06));
    }, this.props.advanceDelay ?? 650);
  }
  back() {
    if (this.state.picking || this.state.step === 0) return;
    this.tone(392, 0, .3, .05);
    this.setState(s => ({ step: s.step - 1 }));
  }

  renderVals() {
    const { step, project, unit, pay, picking, sound } = this.state;
    const w = this.worlds.find(x => x.key === project);
    const phone = (this.props.whatsapp ?? '201200506690').replace(/\D/g, '');
    const msg = `مرحبًا، عايز البروشور والأسعار لمشروع ${w ? w.name : ''}\nنوع الوحدة: ${unit || ''}\nطريقة الدفع: ${pay || ''}`;
    const list = step === 1 ? this.unitList() : this.pays;
    const chosen = step === 1 ? unit : pay;
    const tile = (on, dim) => ({
      bg: on ? '#221e17' : '#1a1814',
      ring: on ? '0 0 0 1px #c9a96e, 0 0 32px rgba(201,169,110,.3)' : '0 0 0 1px rgba(245,239,228,.08)',
      anim: on && picking ? 'glowPulse 1.2s ease-in-out infinite' : 'none',
      op: dim ? .3 : 1, tf: on && picking ? 'scale(1.03)' : dim ? 'scale(.97)' : 'none',
    });
    return {
      soundOn: sound, soundOff: !sound,
      soundColor: sound ? '#c9a96e' : '#a69d8e',
      soundAria: sound ? 'كتم الصوت' : 'تشغيل الصوت',
      toggleSound: () => this.setState(s => ({ sound: !s.sound }), () => this.tone(659.25, 0, .3, .05)),
      hoverTick: () => this.tone(1318.5, 0, .08, .012),
      stepLabel: step < 3 ? `خطوة ${step + 1} من 3` : 'تم',
      pips: [0, 1, 2].map(i => ({ w: step > i ? '100%' : '0%' })),
      canBack: step > 0 && step < 3,
      back: () => this.back(),
      isStep0: step === 0, isOptStep: step === 1 || step === 2, isDone: step === 3,
      worlds: this.worlds.map((x, i) => {
        const on = project === x.key;
        return { ...x, on, delay: .1 + i * .07, pick: () => this.pick(0, x.key), ...tile(on, picking && !on) };
      }),
      crumb: step === 1 ? (w ? w.name : '') : `${w ? w.name : ''} · ${unit || ''}`,
      question: step === 1 ? 'بتدور على إيه؟' : 'هتدفع إزاي؟',
      opts: (step === 1 || step === 2) ? list.map((label, i) => {
        const on = chosen === label;
        return { label, on, delay: .1 + i * .07, basis: step === 1 ? '130px' : '90px',
          ringC: on ? '#c9a96e' : 'rgba(245,239,228,.25)', dot: on ? '#c9a96e' : 'transparent',
          pick: () => this.pick(step, label), ...tile(on, picking && !on) };
      }) : [],
      sparks: this.sparks,
      summary: [
        { k: 'المشروع', v: w ? w.name : '', edit: () => this.setState({ step: 0 }), delay: .15 },
        { k: 'الوحدة', v: unit || '', edit: () => this.setState({ step: 1 }), delay: .22 },
        { k: 'الدفع', v: pay || '', edit: () => this.setState({ step: 2 }), delay: .29 },
      ],
      waHref: `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
      onWa: () => this.tone(1046.5, 0, .5, .06),
      restart: () => { this.tone(392, 0, .3, .05); this.setState({ step: 0, project: null, unit: null, pay: null, picking: null }); },
    };
  }
}
</script>
