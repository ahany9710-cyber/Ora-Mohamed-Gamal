<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #120b2e; overflow-x: clip; -webkit-tap-highlight-color: transparent; }
a { color: #c6ff3d; } a:hover { color: #fff7e8; }
button:focus-visible, a:focus-visible { outline: 3px solid #fff7e8; outline-offset: 3px; }
@keyframes popIn { 0% { opacity: 0; transform: translateY(28px) scale(.7) rotate(-4deg); } 70% { opacity: 1; transform: translateY(-4px) scale(1.04) rotate(1deg); } 100% { opacity: 1; transform: none; } }
@keyframes stepIn { 0% { opacity: 0; transform: translateX(-40px); } 100% { opacity: 1; transform: none; } }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-7px) rotate(6deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
@keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 56px; } }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -14px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
@keyframes fall { 0% { transform: translateY(-20vh) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
@keyframes pulse { 0%,100% { box-shadow: 0 7px 0 #128a43, 0 0 0 0 rgba(37,211,102,.55); } 50% { box-shadow: 0 7px 0 #128a43, 0 0 0 16px rgba(37,211,102,0); } }
@keyframes trophy { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</helmet>
<div dir="rtl" lang="ar" style="position: relative; min-height: 100vh; overflow: hidden; background: #120b2e; color: #fff7e8; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: fixed; inset: 0; pointer-events: none;">
    <sc-for list="{{ stars }}" as="s" hint-placeholder-count="0">
      <span style="position: absolute; top: {{ s.y }}%; left: {{ s.x }}%; width: {{ s.r }}px; height: {{ s.r }}px; border-radius: 50%; background: #fff7e8; animation: twinkle {{ s.d }}s ease-in-out {{ s.delay }}s infinite;"></span>
    </sc-for>
  </div>
  <div aria-hidden="true" style="position: fixed; inset-inline: 0; bottom: 0; height: 42vh; overflow: hidden; pointer-events: none; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 45%); mask-image: linear-gradient(to bottom, transparent, #000 45%);">
    <div style="position: absolute; left: -50%; width: 200%; bottom: 0; height: 200%; transform-origin: center bottom; transform: perspective(260px) rotateX(62deg); background-image: linear-gradient({{ gridColor }} 2px, transparent 2px), linear-gradient(90deg, {{ gridColor }} 2px, transparent 2px); background-size: 56px 56px; animation: gridMove 1.1s linear infinite; transition: background-image .4s;"></div>
  </div>

  <div style="position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 40px) 64px; display: flex; flex-direction: column; gap: 28px; min-height: 100vh; box-sizing: border-box;">

    <header style="display: flex; align-items: center; gap: 14px;">
      <span dir="ltr" style="font-weight: 800; font-size: 26px; letter-spacing: .08em; line-height: 1;">ORA</span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #b9b0e0;">
          <span>{{ levelLabel }}</span>
          <span dir="ltr">{{ xp }} XP</span>
        </div>
        <div style="height: 12px; border-radius: 999px; background: #2a2060; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.35);">
          <div style="height: 100%; width: {{ xpPct }}%; border-radius: 999px; background: linear-gradient(90deg, {{ acc }}, #fff7e8, {{ acc }}); background-size: 200% 100%; animation: shimmer 2.4s linear infinite; transition: width .6s cubic-bezier(.3,1.5,.5,1);"></div>
        </div>
      </div>
      <button type="button" onClick="{{ toggleSound }}" aria-label="{{ soundAria }}" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: #2a2060; box-shadow: 0 4px 0 #0b0720;" style-active="transform: translateY(3px); box-shadow: 0 1px 0 #0b0720;">
        <sc-if value="{{ soundOn }}" hint-placeholder-val="{{ true }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
        </sc-if>
        <sc-if value="{{ soundOff }}" hint-placeholder-val="{{ false }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="m22 9-6 6"></path><path d="m16 9 6 6"></path></svg>
        </sc-if>
      </button>
    </header>

    <sc-if value="{{ isStep0 }}" hint-placeholder-val="{{ true }}">
      <section style="display: flex; flex-direction: column; gap: 22px; animation: stepIn .45s cubic-bezier(.2,1.2,.4,1) both;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 15px; font-weight: 700; color: #c6ff3d;">3 خطوات وتوصلك الأسعار على واتساب</span>
          <h1 style="margin: 0; font-weight: 800; font-size: clamp(38px, 8vw, 64px); line-height: 1.05;">اختار مشروعك مع Ora</h1>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px;">
          <sc-for list="{{ worlds }}" as="w" hint-placeholder-count="5">
            <div style="flex: 1 1 140px; position: relative; animation: popIn .6s cubic-bezier(.2,1.3,.4,1) {{ w.delay }}s both;">
              <button type="button" onClick="{{ w.pick }}" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px 16px; border-radius: 26px; background: #1f1648; border: 3px solid {{ w.border }}; box-shadow: 0 8px 0 {{ w.dark }}; opacity: {{ w.op }}; transform: {{ w.tf }}; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .25s, border-color .2s;" style-hover="border-color: {{ w.color }};" style-active="box-shadow: 0 2px 0 {{ w.dark }}; translate: 0 6px;">
                <span style="position: relative; width: 64px; height: 64px; animation: bob {{ w.bob }}s ease-in-out infinite;">
                  <span style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff7e8 0 8%, {{ w.color }} 30%, {{ w.dark }} 100%);"></span>
                  <span style="position: absolute; left: -12px; right: -12px; top: 26px; height: 12px; border-radius: 50%; border: 3px solid {{ w.color }}; transform: rotate(-16deg); opacity: .9;"></span>
                </span>
                <span dir="ltr" style="font-weight: 800; font-size: 19px; line-height: 1.1; text-align: center;">{{ w.name }}</span>
                <span style="font-size: 14px; font-weight: 600; line-height: 1.2; color: #b9b0e0; text-align: center;">{{ w.place }}</span>
              </button>
              <sc-if value="{{ w.burst }}" hint-placeholder-val="{{ false }}">
                <span dir="ltr" style="position: absolute; left: 50%; top: 4px; font-weight: 800; font-size: 22px; color: {{ w.color }}; pointer-events: none; text-shadow: 0 3px 0 #0b0720; animation: floatUp .8s ease-out both;">+100 XP</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ isStep1 }}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 22px; animation: stepIn .45s cubic-bezier(.2,1.2,.4,1) both;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span dir="ltr" style="align-self: flex-start; font-size: 15px; font-weight: 700; color: {{ acc }};">{{ projectName }}</span>
          <h2 style="margin: 0; font-weight: 800; font-size: clamp(34px, 7vw, 54px); line-height: 1.05;">بتدور على إيه؟</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px;">
          <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
            <div style="flex: 1 1 130px; position: relative; animation: popIn .55s cubic-bezier(.2,1.3,.4,1) {{ o.delay }}s both;">
              <button type="button" onClick="{{ o.pick }}" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-radius: 22px; background: {{ o.bg }}; color: {{ o.ink }}; box-shadow: 0 7px 0 {{ accDark }}; opacity: {{ o.op }}; transform: {{ o.tf }}; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .25s, background .2s;" style-active="box-shadow: 0 2px 0 {{ accDark }}; translate: 0 5px;">
                <span style="font-weight: 800; font-size: 21px; line-height: 1.1;">{{ o.label }}</span>
                <span dir="ltr" style="flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; font-weight: 800; background: rgba(18,11,46,.18);">{{ o.n }}</span>
              </button>
              <sc-if value="{{ o.burst }}" hint-placeholder-val="{{ false }}">
                <span dir="ltr" style="position: absolute; left: 50%; top: 0; font-weight: 800; font-size: 22px; color: #fff7e8; pointer-events: none; text-shadow: 0 3px 0 #0b0720; animation: floatUp .8s ease-out both;">+100 XP</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ isStep2 }}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 22px; animation: stepIn .45s cubic-bezier(.2,1.2,.4,1) both;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="align-self: flex-start; font-size: 15px; font-weight: 700; color: {{ acc }};">{{ unitLabel }}</span>
          <h2 style="margin: 0; font-weight: 800; font-size: clamp(34px, 7vw, 54px); line-height: 1.05;">هتدفع إزاي؟</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px;">
          <sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
            <div style="flex: 1 1 100px; position: relative; animation: popIn .55s cubic-bezier(.2,1.3,.4,1) {{ o.delay }}s both;">
              <button type="button" onClick="{{ o.pick }}" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px 10px; border-radius: 22px; background: {{ o.bg }}; color: {{ o.ink }}; box-shadow: 0 7px 0 {{ accDark }}; opacity: {{ o.op }}; transform: {{ o.tf }}; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .25s, background .2s;" style-active="box-shadow: 0 2px 0 {{ accDark }}; translate: 0 5px;">
                <span style="font-weight: 800; font-size: 21px; line-height: 1.1; text-align: center;">{{ o.label }}</span>
                <span dir="ltr" style="width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: rgba(18,11,46,.18);">{{ o.n }}</span>
              </button>
              <sc-if value="{{ o.burst }}" hint-placeholder-val="{{ false }}">
                <span dir="ltr" style="position: absolute; left: 50%; top: 0; font-weight: 800; font-size: 22px; color: #fff7e8; pointer-events: none; text-shadow: 0 3px 0 #0b0720; animation: floatUp .8s ease-out both;">+100 XP</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 22px; animation: stepIn .45s cubic-bezier(.2,1.2,.4,1) both;">
        <div aria-hidden="true" style="position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2;">
          <sc-for list="{{ confetti }}" as="c" hint-placeholder-count="0">
            <span style="position: absolute; top: 0; left: {{ c.x }}%; width: {{ c.w }}px; height: {{ c.h }}px; border-radius: {{ c.br }}; background: {{ c.color }}; animation: fall {{ c.d }}s cubic-bezier(.3,.6,.6,1) {{ c.delay }}s both;"></span>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <span style="flex: none; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: #ffd23d; color: #120b2e; box-shadow: 0 6px 0 #b8860b; animation: trophy .7s cubic-bezier(.2,1.4,.4,1) .1s both;">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
          </span>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; font-weight: 700; color: #ffd23d;">المهمة اكتملت</span>
            <h2 style="margin: 0; font-weight: 800; font-size: clamp(32px, 7vw, 50px); line-height: 1.05;">البروشور جاهز ليك</h2>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
          <sc-for list="{{ summary }}" as="s" hint-placeholder-count="3">
            <button type="button" onClick="{{ s.edit }}" style="all: unset; cursor: pointer; flex: 1 1 100px; display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 18px; background: #1f1648; border: 2px solid #2a2060; animation: popIn .5s cubic-bezier(.2,1.3,.4,1) {{ s.delay }}s both;" style-hover="border-color: {{ acc }};">
              <span style="font-size: 13px; font-weight: 600; color: #b9b0e0;">{{ s.k }}</span>
              <span style="font-size: 18px; font-weight: 800; line-height: 1.2;">{{ s.v }}</span>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; gap: 12px;">
          <a href="{{ waHref }}" target="_blank" rel="noopener" onClick="{{ onWa }}" style="flex: 2 1 0; min-width: 0; min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; border-radius: 22px; background: #25d366; color: #0b2e18; text-decoration: none; font-weight: 800; font-size: 19px; animation: pulse 1.6s ease-in-out infinite;" style-active="translate: 0 5px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
            <span>ابعتهولي واتساب</span>
          </a>
          <a href="tel:+201200506690" style="flex: 1 1 0; min-width: 0; min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; border-radius: 22px; background: #2a2060; color: #fff7e8; text-decoration: none; font-weight: 800; font-size: 18px; box-shadow: 0 7px 0 #0b0720;" style-active="box-shadow: 0 2px 0 #0b0720; translate: 0 5px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            <span>اتصل</span>
          </a>
        </div>
        <button type="button" onClick="{{ restart }}" style="all: unset; cursor: pointer; align-self: flex-start; font-size: 15px; font-weight: 700; color: #b9b0e0; padding: 8px 0;" style-hover="color: #fff7e8;">العب تاني ←</button>
      </section>
    </sc-if>

    <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ back }}" style="all: unset; cursor: pointer; align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: #b9b0e0; padding: 8px 0;" style-hover="color: #fff7e8;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        <span>رجوع</span>
      </button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;201200506690&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sound&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { step: 0, project: null, unit: null, pay: null, burst: null, sound: true, run: 0 };
  worlds = [
    { key: 'solana-east', name: 'Solana East', place: 'القاهرة الجديدة', color: '#3de0ff', dark: '#0b6e8a' },
    { key: 'zed-east', name: 'ZED East', place: 'القاهرة الجديدة', color: '#c6ff3d', dark: '#5f8a0b' },
    { key: 'zed-west', name: 'ZED West', place: 'الشيخ زايد', color: '#ff4fa3', dark: '#8f1d58' },
    { key: 'solana-west', name: 'Solana West', place: 'غرب القاهرة', color: '#ff8a3d', dark: '#9a4410' },
    { key: 'silversands', name: 'Silversands', place: 'الساحل الشمالي', color: '#ffd23d', dark: '#9a7408' },
  ];
  units = ['شقة', 'دوبلكس', 'تاون هاوس', 'فيلا'];
  coastUnits = ['شاليه', 'تاون هاوس', 'توين هاوس', 'فيلا'];
  pays = ['كاش', 'تقسيط', 'لسه بفكر'];
  stars = Array.from({ length: 40 }, () => ({ x: +(Math.random() * 100).toFixed(1), y: +(Math.random() * 60).toFixed(1), r: Math.random() < .2 ? 3 : 2, d: +(1.5 + Math.random() * 3).toFixed(2), delay: +(Math.random() * 3).toFixed(2) }));
  confetti = Array.from({ length: 60 }, (_, i) => ({ x: +(Math.random() * 100).toFixed(1), w: 6 + Math.round(Math.random() * 8), h: 8 + Math.round(Math.random() * 10), br: i % 3 ? '3px' : '50%', color: ['#3de0ff', '#c6ff3d', '#ff4fa3', '#ff8a3d', '#ffd23d', '#fff7e8'][i % 6], d: +(1.8 + Math.random() * 1.8).toFixed(2), delay: +(Math.random() * .6).toFixed(2) }));

  componentDidMount() {
    this.onKey = e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const n = parseInt(e.key, 10);
      const list = this.currentList();
      if (n >= 1 && n <= list.length) this.pick(this.state.step, list[n - 1]);
      if (e.key === 'Escape' || e.key === 'Backspace') this.back();
    };
    addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { removeEventListener('keydown', this.onKey); clearTimeout(this.t); }

  currentList() {
    const s = this.state.step;
    if (s === 0) return this.worlds.map(w => w.key);
    if (s === 1) return this.state.project === 'silversands' ? this.coastUnits : this.units;
    if (s === 2) return this.pays;
    return [];
  }
  blip(f, at = 0, len = .12) {
    if (!this.state.sound || !(this.props.sound ?? true)) return;
    try {
      const a = this.ac || (this.ac = new (window.AudioContext || window.webkitAudioContext)());
      const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.9, t + len * .7);
      g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + len + .02);
    } catch (e) {}
  }
  pick(step, val) {
    if (this.state.burst || step !== this.state.step) return;
    const field = ['project', 'unit', 'pay'][step];
    this.blip(440 + step * 110);
    navigator.vibrate && navigator.vibrate(12);
    this.setState({ [field]: val, burst: val });
    this.t = setTimeout(() => {
      const next = step + 1;
      this.setState({ step: next, burst: null });
      if (next === 3) [523, 659, 784, 1047].forEach((f, i) => this.blip(f, i * .09, .18));
    }, 620);
  }
  back() {
    if (this.state.burst || this.state.step === 0) return;
    this.blip(260);
    this.setState(s => ({ step: s.step - 1 }));
  }

  renderVals() {
    const { step, project, unit, pay, burst, sound } = this.state;
    const w = this.worlds.find(x => x.key === project);
    const acc = w ? w.color : '#ff4fa3';
    const accDark = w ? w.dark : '#8f1d58';
    const xp = step * 100;
    const phone = (this.props.whatsapp ?? '201200506690').replace(/\D/g, '');
    const msg = `مرحبًا، عايز البروشور والأسعار لمشروع ${w ? w.name : ''}\nنوع الوحدة: ${unit || ''}\nطريقة الدفع: ${pay || ''}`;
    const mkOpts = (list, s) => list.map((label, i) => ({
      label, n: i + 1, delay: i * .07,
      pick: () => this.pick(s, label),
      burst: burst === label,
      bg: burst === label ? '#fff7e8' : acc,
      ink: '#120b2e',
      op: burst && burst !== label ? .3 : 1,
      tf: burst === label ? 'scale(1.07) rotate(-2deg)' : burst ? 'scale(.94)' : 'none',
    }));
    return {
      stars: this.stars,
      confetti: this.confetti,
      gridColor: acc + '55',
      acc, accDark,
      xp, xpPct: Math.max(4, (step / 3) * 100),
      levelLabel: step < 3 ? `المرحلة ${step + 1} من 3` : 'وصلت',
      soundOn: sound, soundOff: !sound,
      soundAria: sound ? 'كتم الصوت' : 'تشغيل الصوت',
      toggleSound: () => this.setState(s => ({ sound: !s.sound })),
      isStep0: step === 0, isStep1: step === 1, isStep2: step === 2, isDone: step === 3,
      canBack: step > 0 && step < 3,
      back: () => this.back(),
      worlds: this.worlds.map((x, i) => ({
        ...x, delay: i * .08, bob: 2.4 + i * .35,
        pick: () => this.pick(0, x.key),
        burst: burst === x.key,
        border: burst === x.key ? x.color : '#2a2060',
        op: burst && burst !== x.key ? .3 : 1,
        tf: burst === x.key ? 'scale(1.08) rotate(-3deg)' : burst ? 'scale(.92)' : 'none',
      })),
      projectName: w ? w.name : '',
      unitLabel: unit ? `${w ? w.name : ''} · ${unit}` : '',
      opts: step === 1 ? mkOpts(this.currentList(), 1) : step === 2 ? mkOpts(this.pays, 2) : [],
      summary: [
        { k: 'المشروع', v: w ? w.name : '', edit: () => this.setState({ step: 0 }), delay: .2 },
        { k: 'الوحدة', v: unit || '', edit: () => this.setState({ step: 1 }), delay: .28 },
        { k: 'الدفع', v: pay || '', edit: () => this.setState({ step: 2 }), delay: .36 },
      ],
      waHref: `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
      onWa: () => this.blip(880, 0, .2),
      restart: () => { this.blip(330); this.setState({ step: 0, project: null, unit: null, pay: null, burst: null }); },
    };
  }
}
</script>
