<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
body { margin: 0; background: #f4f1ec; -webkit-tap-highlight-color: transparent; }
a { color: #111; } a:hover { color: #8a6a3b; }
button:focus-visible, a:focus-visible { outline: 2px solid #111; outline-offset: 3px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes checkIn { from { transform: scale(0); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</helmet>
<div dir="rtl" lang="ar" style="min-height: 100vh; background: #f4f1ec; color: #111; font-family: 'Alexandria', system-ui, sans-serif; font-weight: 400;">
  <div style="max-width: 880px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px) 56px; display: flex; flex-direction: column; gap: 32px; box-sizing: border-box;">

    <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <span dir="ltr" style="font-weight: 300; font-size: 24px; letter-spacing: .32em; line-height: 1;">ORA</span>
      <a href="tel:+201200506690" style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; text-decoration: none; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(17,17,17,.2); transition: background .2s;" style-hover="background: #fff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <span>اتصل بنا</span>
      </a>
    </header>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 500; color: #6b655c;">
        <span style="flex: none; white-space: nowrap;">{{ stepLabel }}</span>
        <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ back }}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 4px; color: #6b655c; transition: color .2s;" style-hover="color: #111;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
            <span>رجوع</span>
          </button>
        </sc-if>
      </div>
      <div style="display: flex; gap: 6px;">
        <sc-for list="{{ pips }}" as="p" hint-placeholder-count="3">
          <span style="flex: 1; height: 3px; border-radius: 3px; background: rgba(17,17,17,.12); overflow: hidden;">
            <span style="display: block; height: 100%; width: {{ p.w }}; background: #111; transition: width .5s cubic-bezier(.6,0,.2,1);"></span>
          </span>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{ isStep0 }}" hint-placeholder-val="{{ true }}">
      <section style="display: flex; flex-direction: column; gap: 24px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <h1 style="margin: 0; font-weight: 500; font-size: clamp(32px, 6.4vw, 52px); line-height: 1.2;">اختار مشروعك مع Ora</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #6b655c;">3 اختيارات سريعة، والبروشور والأسعار يوصلوك على واتساب.</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px;">
          <sc-for list="{{ worlds }}" as="w" hint-placeholder-count="5">
            <button type="button" onClick="{{ w.pick }}" style="all: unset; box-sizing: border-box; cursor: pointer; flex: 1 1 150px; display: flex; flex-direction: column; gap: 10px; padding: 8px 8px 14px; border-radius: 20px; background: {{ w.bg }}; color: {{ w.ink }}; opacity: {{ w.op }}; transform: {{ w.tf }}; animation: rise .5s cubic-bezier(.2,.8,.2,1) {{ w.delay }}s both; transition: background .25s, color .25s, opacity .3s, transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .25s;" style-hover="box-shadow: 0 10px 30px rgba(17,17,17,.08);" style-active="transform: scale(.97);">
              <span style="position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #e7e1d7;">
                <image-slot id="ora3-{{ w.key }}" shape="rect" placeholder="صورة {{ w.name }}"></image-slot>
              </span>
              <span style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 0 6px;">
                <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                  <span dir="ltr" style="font-weight: 500; font-size: 17px; line-height: 1.25; text-align: right;">{{ w.name }}</span>
                  <span style="font-size: 13px; line-height: 1.4; opacity: .65;">{{ w.place }}</span>
                </span>
                <sc-if value="{{ w.on }}" hint-placeholder-val="{{ false }}">
                  <span style="flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #f4f1ec; color: #111; animation: checkIn .3s cubic-bezier(.3,1.5,.5,1) both;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                  </span>
                </sc-if>
              </span>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ isOptStep }}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 24px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <span dir="ltr" style="align-self: flex-start; font-size: 13px; font-weight: 500; color: #8a6a3b;">{{ crumb }}</span>
          <h2 style="margin: 0; font-weight: 500; font-size: clamp(30px, 6vw, 46px); line-height: 1.2;">{{ question }}</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px;">
          <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
            <button type="button" onClick="{{ o.pick }}" style="all: unset; box-sizing: border-box; cursor: pointer; flex: 1 1 {{ o.basis }}; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: 18px; background: {{ o.bg }}; color: {{ o.ink }}; opacity: {{ o.op }}; transform: {{ o.tf }}; animation: rise .45s cubic-bezier(.2,.8,.2,1) {{ o.delay }}s both; transition: background .25s, color .25s, opacity .3s, transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .25s;" style-hover="box-shadow: 0 10px 30px rgba(17,17,17,.08);" style-active="transform: scale(.97);">
              <span style="font-weight: 500; font-size: 18px; line-height: 1.3;">{{ o.label }}</span>
              <span style="flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid {{ o.ring }}; background: {{ o.dot }}; color: #111; transition: background .25s, border-color .25s;">
                <sc-if value="{{ o.on }}" hint-placeholder-val="{{ false }}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="animation: checkIn .3s cubic-bezier(.3,1.5,.5,1) both;"><path d="M20 6 9 17l-5-5"></path></svg>
                </sc-if>
              </span>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 24px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 13px; font-weight: 500; color: #8a6a3b;">تمام كده</span>
          <h2 style="margin: 0; font-weight: 500; font-size: clamp(30px, 6vw, 46px); line-height: 1.2;">البروشور والأسعار جاهزين</h2>
        </div>
        <div style="display: flex; gap: 10px;">
          <sc-for list="{{ summary }}" as="s" hint-placeholder-count="3">
            <button type="button" onClick="{{ s.edit }}" style="all: unset; box-sizing: border-box; cursor: pointer; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 14px 14px; border-radius: 16px; background: #fff; animation: rise .45s cubic-bezier(.2,.8,.2,1) {{ s.delay }}s both; transition: box-shadow .25s;" style-hover="box-shadow: 0 10px 30px rgba(17,17,17,.08);">
              <span style="font-size: 12px; color: #6b655c;">{{ s.k }}</span>
              <span style="font-size: 15px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere;">{{ s.v }}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 10px; animation: rise .45s cubic-bezier(.2,.8,.2,1) .3s both;">
          <a href="{{ waHref }}" target="_blank" rel="noopener" style="flex: 2 1 0; min-width: 0; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px; border-radius: 999px; background: #111; color: #f4f1ec; text-decoration: none; font-weight: 500; font-size: 16px; transition: background .2s, transform .2s;" style-hover="background: #2b2925; color: #f4f1ec;" style-active="transform: scale(.97);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
            <span>ابعتهولي واتساب</span>
          </a>
          <a href="tel:+201200506690" style="flex: 1 1 0; min-width: 0; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(17,17,17,.25); text-decoration: none; font-weight: 500; font-size: 16px; transition: background .2s, transform .2s;" style-hover="background: #fff; color: #111;" style-active="transform: scale(.97);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            <span>اتصل</span>
          </a>
        </div>
        <button type="button" onClick="{{ restart }}" style="all: unset; cursor: pointer; align-self: flex-start; font-size: 14px; color: #6b655c; padding: 6px 0; transition: color .2s;" style-hover="color: #111;">ابدأ من الأول</button>
      </section>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;201200506690&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;advanceDelay&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:420,&quot;min&quot;:0,&quot;max&quot;:1200,&quot;step&quot;:20,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { step: 0, project: null, unit: null, pay: null, picking: null };
  worlds = [
    { key: 'solana-east', name: 'Solana East', place: 'القاهرة الجديدة' },
    { key: 'zed-east', name: 'ZED East', place: 'القاهرة الجديدة' },
    { key: 'zed-west', name: 'ZED West', place: 'الشيخ زايد' },
    { key: 'solana-west', name: 'Solana West', place: 'نيو زايد' },
    { key: 'silversands', name: 'Silversands', place: 'الساحل الشمالي' },
  ];
  units = ['شقة', 'دوبلكس', 'تاون هاوس', 'فيلا'];
  coastUnits = ['شاليه', 'تاون هاوس', 'توين هاوس', 'فيلا'];
  pays = ['كاش', 'تقسيط', 'لسه بقرر'];

  componentWillUnmount() { clearTimeout(this.t); }
  pick(step, val) {
    if (this.state.picking || step !== this.state.step) return;
    const field = ['project', 'unit', 'pay'][step];
    navigator.vibrate && navigator.vibrate(8);
    this.setState({ [field]: val, picking: val });
    this.t = setTimeout(() => this.setState({ step: step + 1, picking: null }), this.props.advanceDelay ?? 420);
  }
  renderVals() {
    const { step, project, unit, pay, picking } = this.state;
    const w = this.worlds.find(x => x.key === project);
    const phone = (this.props.whatsapp ?? '201200506690').replace(/\D/g, '');
    const msg = `مرحبًا، عايز البروشور والأسعار لمشروع ${w ? w.name : ''}\nنوع الوحدة: ${unit || ''}\nطريقة الدفع: ${pay || ''}`;
    const list = step === 1 ? (project === 'silversands' ? this.coastUnits : this.units) : this.pays;
    const chosen = step === 1 ? unit : pay;
    const tile = (on, dim) => ({
      bg: on ? '#111' : '#fff', ink: on ? '#f4f1ec' : '#111',
      op: dim ? .35 : 1, tf: on && picking ? 'scale(1.02)' : 'none',
    });
    return {
      stepLabel: step < 3 ? `خطوة ${step + 1} من 3` : 'تم',
      pips: [0, 1, 2].map(i => ({ w: step > i ? '100%' : '0%' })),
      canBack: step > 0 && step < 3,
      back: () => !picking && this.setState(s => ({ step: s.step - 1 })),
      isStep0: step === 0, isOptStep: step === 1 || step === 2, isDone: step === 3,
      worlds: this.worlds.map((x, i) => {
        const on = project === x.key;
        return { ...x, on, delay: i * .05, pick: () => this.pick(0, x.key), ...tile(on, picking && !on) };
      }),
      crumb: step === 1 ? (w ? w.name : '') : `${w ? w.name : ''} · ${unit || ''}`,
      question: step === 1 ? 'بتدور على إيه؟' : 'هتدفع إزاي؟',
      opts: (step === 1 || step === 2) ? list.map((label, i) => {
        const on = chosen === label;
        return { label, on, delay: i * .05, basis: step === 1 ? '130px' : '90px',
          ring: on ? '#f4f1ec' : 'rgba(17,17,17,.25)', dot: on ? '#f4f1ec' : 'transparent',
          pick: () => this.pick(step, label), ...tile(on, picking && !on) };
      }) : [],
      summary: [
        { k: 'المشروع', v: w ? w.name : '', edit: () => this.setState({ step: 0 }), delay: .1 },
        { k: 'الوحدة', v: unit || '', edit: () => this.setState({ step: 1 }), delay: .15 },
        { k: 'الدفع', v: pay || '', edit: () => this.setState({ step: 2 }), delay: .2 },
      ],
      waHref: `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
      restart: () => this.setState({ step: 0, project: null, unit: null, pay: null, picking: null }),
    };
  }
}
</script>
</body>
</html>
