<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-ddb0104b-2f59-4b04-998e-f8e7ec72377e/styles.css">
<script src="_ds/organic-ddb0104b-2f59-4b04-998e-f8e7ec72377e/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: var(--color-bg); overflow-x: clip; text-wrap: pretty; }
a { color: var(--color-accent-700); }
a:hover { color: var(--color-accent-800); }
</style>
</helmet>
<div dir="rtl" lang="ar" style="min-height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body), 'Readex Pro', sans-serif; position: relative; padding-bottom: 120px;">
  <div style="position: absolute; left: -120px; top: -140px; width: 340px; height: 340px; border-radius: 50%; background: var(--color-accent-2-200); pointer-events: none;"></div>

  <nav style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1120px; margin: 0 auto; padding: 20px clamp(20px, 5vw, 56px);">
    <span style="font-family: var(--font-heading), 'Lalezar', serif; font-size: 26px; line-height: 1;">Ora</span>
    <a href="tel:+201200506690" class="btn btn-ghost" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      <span>اتصل بنا</span>
    </a>
  </nav>

  <header style="position: relative; max-width: 1120px; margin: 0 auto; padding: 48px clamp(20px, 5vw, 56px) 40px;">
    <h1 style="font-family: var(--font-heading), 'Lalezar', serif; font-weight: 400; font-size: clamp(40px, 7vw, 72px); line-height: 1.15; margin: 0; max-width: 14ch;">اختار مشروعك مع Ora</h1>
    <p style="font-size: 18px; line-height: 1.7; margin: 20px 0 0; max-width: 46ch; color: var(--color-neutral-800);">اختار المشروع اللي يهمك، واستلم البروشور والأسعار على واتساب.</p>
  </header>

  <main style="position: relative; max-width: 1120px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 56px);">
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px;">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="5">
        <button type="button" onClick="{{ p.select }}" aria-pressed="{{ p.pressed }}" style="all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 16px; padding: 12px 12px 20px; border-radius: 32px; background: {{ p.bg }}; box-shadow: {{ p.shadow }}; outline-offset: 3px; transition: background .2s, box-shadow .2s;" style-hover="background: var(--color-accent-100);" style-focus="outline: 2px solid var(--color-accent);">
          <div class="washed" style="position: relative; border-radius: 24px; overflow: hidden; aspect-ratio: 4 / 3;">
            <image-slot id="ora-{{ p.key }}" shape="rect" placeholder="صورة {{ p.name }}"></image-slot>
          </div>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 0 8px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <span dir="ltr" style="font-family: var(--font-heading), 'Lalezar', serif; font-size: 26px; line-height: 1.15; text-align: right;">{{ p.name }}</span>
              <span style="font-size: 15px; line-height: 1.5; color: var(--color-neutral-700);">{{ p.place }}</span>
            </div>
            <span style="flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: {{ p.dotBg }}; color: var(--color-bg); border: 2px solid {{ p.dotBorder }};">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </span>
          </div>
        </button>
      </sc-for>
    </div>
  </main>

  <div style="position: fixed; inset-inline: 0; bottom: 0; padding: 16px clamp(16px, 5vw, 56px) 20px; display: flex; justify-content: center; pointer-events: none;">
    <div style="pointer-events: auto; width: 100%; max-width: 640px; display: flex; align-items: center; gap: 12px; padding: 10px; padding-inline-start: 22px; border-radius: 999px; background: var(--color-text); color: var(--color-bg); box-shadow: var(--shadow-lg);">
      <span style="flex: 1; min-width: 0; font-size: 15px; line-height: 1.4;">{{ barLabel }}</span>
      <a href="{{ waHref }}" target="_blank" rel="noopener" aria-disabled="{{ noneSelected }}" class="btn btn-primary" style="text-decoration: none; display: flex; align-items: center; gap: 8px; white-space: nowrap; opacity: {{ ctaOpacity }}; pointer-events: {{ ctaPointer }};">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
        <span>{{ ctaLabel }}</span>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;201200506690&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;multiSelect&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { sel: [] };
  list = [
    { key: 'solana-east', name: 'Solana East', place: 'القاهرة الجديدة' },
    { key: 'zed-east', name: 'ZED East', place: 'القاهرة الجديدة' },
    { key: 'zed-west', name: 'ZED West', place: 'الشيخ زايد' },
    { key: 'solana-west', name: 'Solana West', place: 'غرب القاهرة' },
    { key: 'silversands', name: 'Silversands', place: 'الساحل الشمالي' },
  ];
  toggle(key) {
    const multi = this.props.multiSelect ?? true;
    this.setState(s => {
      const on = s.sel.includes(key);
      if (!multi) return { sel: on ? [] : [key] };
      return { sel: on ? s.sel.filter(k => k !== key) : [...s.sel, key] };
    });
  }
  renderVals() {
    const sel = this.state.sel;
    const phone = (this.props.whatsapp ?? '201200506690').replace(/\D/g, '');
    const names = this.list.filter(p => sel.includes(p.key)).map(p => p.name);
    const msg = `مرحبًا، عايز البروشور والأسعار لـ: ${names.join('، ')}`;
    const none = names.length === 0;
    return {
      projects: this.list.map(p => {
        const on = sel.includes(p.key);
        return {
          ...p,
          pressed: on ? 'true' : 'false',
          select: () => this.toggle(p.key),
          bg: on ? 'var(--color-accent-100)' : 'var(--color-surface, var(--color-neutral-100))',
          shadow: on ? '0 0 0 3px var(--color-accent)' : 'var(--shadow-sm)',
          dotBg: on ? 'var(--color-accent)' : 'transparent',
          dotBorder: on ? 'var(--color-accent)' : 'var(--color-neutral-400)',
        };
      }),
      barLabel: none ? 'اختار مشروع أو أكثر' : names.join('، '),
      ctaLabel: none ? 'واتساب' : 'استلم البروشور',
      waHref: `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
      noneSelected: none ? 'true' : 'false',
      ctaOpacity: none ? 0.45 : 1,
      ctaPointer: none ? 'none' : 'auto',
    };
  }
}
</script>
</body>
</html>
